name: Deploy 잇다(IT-DA) demo to GitHub Pages

# 이 저장소의 GitHub Pages는 gh-pages 브랜치 배포 방식(다른 프로젝트 site/가
# 저장소 루트를 이미 사용 중)이므로, 잇다 데모는 gh-pages 브랜치의 /itda
# 하위 경로에만 배포하고 나머지 파일은 건드리지 않는다(keep_files: true).

on:
  push:
    branches:
      - main
      - claude/itda-demo-web-4pce72
    paths:
      - "itda-web/**"
      - ".github/workflows/deploy-itda.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: itda-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: itda-web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: itda-web/out
          destination_dir: itda
          keep_files: true
